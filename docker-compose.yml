# poly-chatterbox on an NVIDIA GPU, over plain HTTP.
#
#   cp .env.example .env      # optional: port, model settings, serve flags, ...
#   docker compose up -d --build
#   http://<host>:8000
#
# For HTTPS, use docker-compose.https.yml instead.

services:
  app:
    build: .
    image: poly-chatterbox:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      POLY_CHATTERBOX_SERVE_ARGS: ${POLY_CHATTERBOX_SERVE_ARGS:-}
      POLY_CHATTERBOX_MAX_LOADED_MODELS: ${POLY_CHATTERBOX_MAX_LOADED_MODELS:-3}
      POLY_CHATTERBOX_MULTILINGUAL_VERSION: ${POLY_CHATTERBOX_MULTILINGUAL_VERSION:-v3}
      POLY_CHATTERBOX_MAX_CHUNK_CHARS: ${POLY_CHATTERBOX_MAX_CHUNK_CHARS:-300}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/data/cache
      - library:/data/library
      # Saved prompts. PROMPTS_DIR in .env can point this at a host folder instead (e.g. ./prompts).
      - ${PROMPTS_DIR:-prompts}:/data/prompts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:      # model weights (1-3 GB per model, downloaded on first use)
  library:     # saved voices and downloaded demo voices
  prompts:     # saved prompts
