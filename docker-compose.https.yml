# Same stack as docker-compose.yml, with an nginx sidecar terminating HTTPS.
#
#   cp .env.https.example .env      # put the host's LAN address in the certificate
#   docker compose -f docker-compose.https.yml up -d --build
#   https://<host>:8443
#
# HTTPS is port 8443, not 8000. 8000 is the app's own plain HTTP listener and is
# published on 127.0.0.1 only; pointing a browser at https://<host>:8000 gets
# you "SSL_ERROR_RX_RECORD_TOO_LONG", because nothing there speaks TLS.
#
# The certificate is self-signed and generated into ./certs on first boot, so
# the browser will warn once until you accept it (or drop a real
# fullchain.pem / privkey.pem into ./certs).

services:
  app:
    build: .
    image: poly-chatterbox:latest
    restart: unless-stopped
    # Bound to loopback only - nginx is the way in from anywhere else. Drop the
    # 127.0.0.1 prefix if you want plain HTTP on the LAN as well.
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      POLY_CHATTERBOX_SERVE_ARGS: ${POLY_CHATTERBOX_SERVE_ARGS:-}
      POLY_CHATTERBOX_MAX_LOADED_MODELS: ${POLY_CHATTERBOX_MAX_LOADED_MODELS:-3}
      POLY_CHATTERBOX_MULTILINGUAL_VERSION: ${POLY_CHATTERBOX_MULTILINGUAL_VERSION:-v3}
      POLY_CHATTERBOX_MAX_CHUNK_CHARS: ${POLY_CHATTERBOX_MAX_CHUNK_CHARS:-300}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/data/cache
      - library:/data/library
      # Saved prompts. PROMPTS_DIR in .env can point this at a host folder instead (e.g. ./prompts).
      - ${PROMPTS_DIR:-prompts}:/data/prompts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # TLS front end. Terminates HTTPS and proxies to the app over the internal
  # compose network, so the app itself never speaks TLS.
  nginx:
    build:
      context: ./docker/nginx
    image: poly-chatterbox-nginx:local
    restart: unless-stopped

    # Start order only, not readiness: nginx returning 502 while the model loads
    # is better than nginx refusing to start.
    depends_on:
      - app

    ports:
      - "${HTTPS_PORT:-8443}:443"

    volumes:
      - ${NGINX_CONF:-./docker/nginx/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      # Self-signed cert is generated here on first boot. Drop real fullchain.pem
      # / privkey.pem in to use a CA-issued one instead.
      - ./certs:/etc/nginx/certs

    environment:
      TLS_COMMON_NAME: "${TLS_COMMON_NAME:-localhost}"
      TLS_SAN: "${TLS_SAN:-DNS:localhost,IP:127.0.0.1}"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# Same volumes as docker-compose.yml: both stacks use the same project name, so
# switching between them keeps the downloaded weights and saved voices.
volumes:
  models:      # model weights (1-3 GB per model, downloaded on first use)
  library:     # saved voices and downloaded demo voices
  prompts:     # saved prompts
