<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poly Chatterbox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%235b4bdb%22/%3E%3Cpath d=%22M4 6v4M6.5 4v8M9 5.5v5M11.5 7v2%22 stroke=%22white%22 stroke-width=%221.4%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Poly <span>Chatterbox</span></div>
    <div id="status" class="status" title="Backend status">connecting…</div>
    <a class="docs-link" href="/docs" target="_blank" rel="noopener">API docs</a>
  </header>

  <nav class="tabbar" aria-label="Workspaces">
    <div id="tabs" class="tabs" role="tablist"></div>
    <button id="new-tab" class="new-tab" title="New workspace (Alt+N)" aria-label="New workspace">+</button>
  </nav>

  <main id="workspaces"></main>

  <template id="workspace-template">
    <section class="workspace" role="tabpanel">
      <div class="modes" role="radiogroup" aria-label="Mode"></div>
      <p class="mode-hint"></p>
      <div class="columns">
        <form class="form" autocomplete="off"></form>
        <div class="results">
          <div class="results-head">
            <h2>Results</h2>
            <button type="button" class="link clear-results">Clear</button>
          </div>
          <div class="result-list"><p class="empty">Generated audio appears here.</p></div>
        </div>
      </div>
    </section>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
